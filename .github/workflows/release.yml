name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Set under Settings → Secrets and variables → Actions → Variables; baked into the bundle at build time
      WXT_API_BASE_URL: ${{ vars.WXT_API_BASE_URL }}
      WXT_PORTAL_URL: ${{ vars.WXT_PORTAL_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Check build variables are set
        run: |
          for v in WXT_API_BASE_URL WXT_PORTAL_URL; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set"; exit 1; fi
          done

      - run: npm ci

      - run: npm test

      - run: npm run zip:all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/qx-insights-v*.zip \
            --title "QX+ Insights $GITHUB_REF_NAME" \
            --generate-notes
